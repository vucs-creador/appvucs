<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Estratégico | AppVucs</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#667085}.title{margin:4px 0;font-size:30px;color:#141b4d}.sub{color:#667085}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:#141b4d;color:white}.btn:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:18px;box-shadow:0 6px 22px rgba(20,27,77,.06)}.label{font-size:12px;color:#667085}.value{font-size:26px;font-weight:850;margin-top:6px}.main{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:20px}.panel h2{margin:0 0 12px;color:#141b4d;font-size:18px}.status{padding:10px 12px;border-radius:10px;background:#f2f4f7;color:#475467}.analysis{white-space:pre-wrap;line-height:1.65;color:#283548}.error{color:#b42318;background:#fef3f2}.loading{color:#475467}@media(max-width:760px){.grid,.main{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.grid,.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">APPVUCS · CENTRO DE INTELIGENCIA</div><h1 class="title">🧠 Coach Estratégico</h1><div class="sub">Analiza la operación comercial con datos reales y prioriza acciones.</div></div>
    <button id="run" class="btn">Analizar operación</button>
  </div>
  <div class="grid" id="kpis">
    <div class="card"><div class="label">Ventas</div><div class="value">—</div></div>
    <div class="card"><div class="label">Meta</div><div class="value">—</div></div>
    <div class="card"><div class="label">Cumplimiento</div><div class="value">—</div></div>
    <div class="card"><div class="label">Forecast</div><div class="value">—</div></div>
  </div>
  <div class="main">
    <section class="panel"><h2>Estado</h2><div id="status" class="status">Listo. Pulsa “Analizar operación”.</div><h2 style="margin-top:22px">Señales</h2><div id="signals" class="analysis">—</div></section>
    <section class="panel"><h2>Diagnóstico estratégico</h2><div id="analysis" class="analysis">Aún no se ha ejecutado el análisis.</div></section>
  </div>
</div>
<script>
(function(){
'use strict';
// Esta pagina es independiente (se abre en pestana nueva), asi que trae su
// propia conexion a Supabase en vez de depender de la de index.html.
window.sb = { _url: 'https://jcddfjsetmgdlafjabdq.supabase.co' };
window._supaHeaders = {
  'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZGRmanNldG1nZGxhZmphYmRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTQ2MTksImV4cCI6MjA5NjA5MDYxOX0.NytxezqoeuHKB_6zZM-xO2Tqk3_OqzP0IdYBk7Z2FLE',
  'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZGRmanNldG1nZGxhZmphYmRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTQ2MTksImV4cCI6MjA5NjA5MDYxOX0.NytxezqoeuHKB_6zZM-xO2Tqk3_OqzP0IdYBk7Z2FLE',
  'Content-Type': 'application/json'
};
const $=id=>document.getElementById(id);
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function pct(a,b){return b?Math.round(a/b*10000)/100:null}
function month(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
async function supa(table,q){
  if(!window.sb||!window.sb._url||!window._supaHeaders) throw new Error('La conexión de AppVucs todavía no está disponible.');
  const r=await fetch(window.sb._url+'/rest/v1/'+table+'?'+q,{headers:window._supaHeaders});
  if(!r.ok) throw new Error('Supabase no permitió consultar '+table+' ('+r.status+').');
  return r.json();
}
async function snapshot(){
  const m=month();
  const registros=await supa('registros','select=*&mes=eq.'+encodeURIComponent(m)+'&limit=10000');
  const metas=await supa('metas','select=*&mes=eq.'+encodeURIComponent(m)+'&limit=1000');
  const sales=registros.reduce((s,r)=>s+n(r.cierres),0),target=metas.reduce((s,r)=>s+n(r.meta),0);
  const prospects=registros.reduce((s,r)=>s+n(r.vcampana)+n(r.vreferido)+n(r.vrmk),0);
  const followups=registros.reduce((s,r)=>s+n(r.seguimientos),0);
  const dayKeys=[...new Set(registros.map(r=>String(r.semana)+'-'+String(r.dia)))];
  const pace=dayKeys.length?sales/dayKeys.length:null;
  const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const projected=pace==null?null:pace*daysInMonth;
  const advisors={};
  registros.forEach(r=>{const name=r.asesor||'Sin asesor';if(!advisors[name])advisors[name]={name,sales:0,activity:0,prospects:0};const a=advisors[name];a.sales+=n(r.cierres);a.activity+=n(r.mensajes)+n(r.seguimientos);a.prospects+=n(r.vcampana)+n(r.vreferido)+n(r.vrmk)});
  const advisorList=Object.values(advisors).map(a=>{const meta=metas.find(x=>String(x.asesor)===String(a.name));const mt=meta?n(meta.meta):0;return {...a,target:mt,achievementPct:pct(a.sales,mt),conversionPct:pct(a.sales,a.prospects)}});
  return {date:new Date().toISOString().slice(0,10),company:{sales,target,achievementPct:pct(sales,target),currentDailyPace:pace,requiredDailyPace:null,variationVsPreviousPeriodPct:null},funnel:{prospects,contacts:null,followups,procedures:null,sales,prospectToSalePct:pct(sales,prospects),followupToSalePct:null},forecast:{projectedSales:projected,projectedAchievementPct:pct(projected,target),gapToTarget:projected==null?null:projected-target},advisors:advisorList,alerts:[],previousAnalysis:null};
}
function renderKpis(x){const c=x.company, f=x.forecast;const cards=[c.sales,c.target,c.achievementPct==null?'—':c.achievementPct+'%',f.projectedSales==null?'—':Math.round(f.projectedSales)];document.querySelectorAll('#kpis .value').forEach((e,i)=>e.textContent=cards[i])}
async function run(){
  $('run').disabled=true;$('status').className='status loading';$('status').textContent='Leyendo indicadores reales de AppVucs…';$('analysis').textContent='';$('signals').textContent='';
  try{
    const data=await snapshot();renderKpis(data);$('status').textContent='Datos cargados. Analizando con el Coach Estratégico…';
    const r=await fetch('/api/coach-snapshot',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const out=await r.json();
    if(!r.ok||!out.ok) throw new Error(out.error||'El agente no pudo completar el análisis.');
    $('status').textContent='Análisis generado: '+new Date(out.generatedAt).toLocaleString('es-CO');
    $('analysis').textContent=out.analysis||'Sin diagnóstico.';
    $('signals').textContent=(out.signals||[]).map(s=>'• ['+(s.severity||'info').toUpperCase()+'] '+s.message).join('\n')||'No se detectaron señales heurísticas.';
  }catch(e){$('status').className='status error';$('status').textContent='No fue posible ejecutar el agente.';$('analysis').textContent=e.message;$('signals').textContent='';}
  finally{$('run').disabled=false}
}
$('run').addEventListener('click',run);
})();
</script>
</body>
</html>
